<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
  <section>
    <h2>Formulário</h2>
    <form action="cadastro.php" method="post">
        <p><label>Nome:</label>
            <input type="text" name="nome" placeholder="Digite seu nome" required>
    </p>
    <p><label>Senha:</label>
        <input type="password" name="senha" required maxlength="8">
    </p>
    <p><label>Telefone:</label>
        <input type="password" name="telefone" required maxlength="8">
    </p>
    <p><label>Email:</label>
        <input type="password" name="email" required maxlength="8">
    </p>
    <p><label>CEP:</label>
        <input type="password" name="CEP" required maxlength="8">
    </p>
    <p><label>Sobre você:</label>
        <textarea name="bio" rows="10" cols="100"></textarea>
    </p>
    <p><label>Gênero:</label>
        <input type="radio" name="genero" value="M">Masculino
        <input type="radio" name="genero" value="F">Feminino
    </p>
    <p><label>Interesses:</label>
        <input type="checkbox" name="interesses" value="Tecnologia">Tecnologia
        <input type="checkbox" name="interesses" value="Esportes">Esportes
        <input type="checkbox" name="interesses" value="Artes">Artes  
    </p>
    <p><label>País:</label>
        <select name="país">
        <option value="brasil">Brasil</option>
        <option value="venezuela">Venezuela</option>
        <option value="china">China</option>
    </select>
    </p>
    <p><label>Foto de perfil:</label></p>
        <input type="file" name="foto">

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>
  </section>  
</body>
</html>
